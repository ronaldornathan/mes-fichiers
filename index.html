<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icon-192.png" />
		<link rel="apple-touch-icon" href="icon-192.png" />
		<meta name="theme-color" content="#1e1e1e" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Fichiers" />
		<title>Mes fichiers</title>
		<style>
			:root {
				--window-bg: #ececec;
				--sidebar-bg: #e1e1e6;
				--panel: #ffffff;
				--text: #1d1d1f;
				--muted: #6e6e73;
				--line: rgba(0, 0, 0, 0.1);
				--accent: #007aff;
				--danger: #ff3b30;
				--warn: #ff9500;
				--hover: rgba(0, 0, 0, 0.05);
				--active: rgba(0, 122, 255, 0.15);
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--window-bg: #1e1e1e;
					--sidebar-bg: #252528;
					--panel: #2d2d30;
					--text: #f5f5f7;
					--muted: #98989d;
					--line: rgba(255, 255, 255, 0.1);
					--accent: #0a84ff;
					--danger: #ff453a;
					--warn: #ff9f0a;
					--hover: rgba(255, 255, 255, 0.08);
					--active: rgba(10, 132, 255, 0.25);
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
				overflow: hidden;
			}
			body {
				font:
					13px/1.4 -apple-system,
					BlinkMacSystemFont,
					'SF Pro Text',
					'SF Pro',
					'Segoe UI',
					Roboto,
					sans-serif;
				background: var(--window-bg);
				color: var(--text);
			}
			button,
			input {
				font: inherit;
				color: inherit;
			}
			button {
				cursor: pointer;
				border: 1px solid var(--line);
				background: var(--panel);
				border-radius: 6px;
				padding: 5px 10px;
				transition: all 0.1s ease;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				white-space: nowrap;
			}
			button:hover {
				background: var(--hover);
			}
			button.primary {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
			button.primary:hover {
				opacity: 0.9;
			}
			[hidden] {
				display: none !important;
			}

			/* Conteneur Plein Écran Type macOS */
			#macos-window {
				width: 100vw;
				height: 100vh;
				background: var(--window-bg);
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}

			/* Barre de titre macOS */
			.titlebar {
				height: 38px;
				display: flex;
				align-items: center;
				padding: 0 14px;
				position: relative;
				border-bottom: 1px solid var(--line);
				background: var(--window-bg);
				user-select: none;
				flex-shrink: 0;
			}
			.traffic-lights {
				display: flex;
				gap: 8px;
			}
			.dot {
				width: 12px;
				height: 12px;
				border-radius: 50%;
				border: 0.5px solid rgba(0, 0, 0, 0.15);
			}
			.dot.close {
				background: #ff5f56;
				border-color: #e0443e;
			}
			.dot.minimize {
				background: #ffbd2e;
				border-color: #dea123;
			}
			.dot.zoom {
				background: #27c93f;
				border-color: #1aab29;
			}

			.titlebar-title {
				position: absolute;
				left: 50%;
				transform: translateX(-50%);
				font-weight: 500;
				font-size: 13px;
				color: var(--text);
				display: flex;
				align-items: center;
				gap: 6px;
			}

			/* Écran de connexion */
			#login {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 20px;
				background: var(--window-bg);
			}
			#login form {
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 12px;
				padding: 32px;
				width: 100%;
				max-width: 320px;
				display: flex;
				flex-direction: column;
				gap: 14px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
				text-align: center;
			}
			#login h1 {
				margin: 0 0 4px;
				font-size: 18px;
			}
			input[type='password'],
			input[type='search'] {
				border: 1px solid var(--line);
				background: var(--panel);
				border-radius: 6px;
				padding: 6px 10px;
				outline: none;
			}
			input[type='password']:focus,
			input[type='search']:focus {
				border-color: var(--accent);
				box-shadow: 0 0 0 2px var(--active);
			}

			/* Layout principal */
			#app {
				flex: 1;
				display: flex;
				min-height: 0;
				overflow: hidden;
			}

			/* Sidebar */
			aside {
				width: 220px;
				background: var(--sidebar-bg);
				border-right: 1px solid var(--line);
				padding: 12px 8px;
				display: flex;
				flex-direction: column;
				gap: 16px;
				user-select: none;
				flex-shrink: 0;
			}
			.sidebar-section {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}
			aside h2 {
				margin: 0 0 4px 8px;
				font-size: 11px;
				text-transform: uppercase;
				color: var(--muted);
				letter-spacing: 0.5px;
				font-weight: 600;
			}
			.sidebar-item {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 6px 8px;
				border-radius: 6px;
				cursor: pointer;
				color: var(--text);
				font-size: 13px;
				border: none;
				background: transparent;
				width: 100%;
				text-align: left;
			}
			.sidebar-item:hover {
				background: var(--hover);
			}
			.sidebar-item.active {
				background: var(--active);
				color: var(--accent);
				font-weight: 500;
			}
			.sidebar-item svg {
				width: 16px;
				height: 16px;
				fill: currentColor;
				flex-shrink: 0;
			}

			/* Widget d'utilisation stockage */
			.usage {
				margin-top: auto;
				padding: 10px;
				background: var(--panel);
				border-radius: 8px;
				border: 1px solid var(--line);
			}
			.usage small {
				color: var(--muted);
				display: block;
				margin-top: 6px;
				font-size: 11px;
			}
			.track {
				height: 5px;
				background: var(--line);
				border-radius: 3px;
				overflow: hidden;
			}
			#bar {
				height: 100%;
				width: 0;
				background: var(--accent);
				transition: width 0.3s;
			}
			#bar.warn {
				background: var(--warn);
			}

			/* Zone principale */
			main {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-width: 0;
				background: var(--panel);
				overflow: hidden;
			}

			/* Toolbar ultra-responsive et toujours visible */
			.toolbar {
				display: flex;
				gap: 8px;
				align-items: center;
				padding: 10px 16px;
				border-bottom: 1px solid var(--line);
				background: var(--window-bg);
				flex-shrink: 0;
				flex-wrap: wrap; /* Permet aux éléments de passer à la ligne proprement si l'écran est trop petit */
			}
			.crumbs {
				display: flex;
				gap: 2px;
				flex: 1;
				min-width: 120px;
				align-items: center;
				overflow-x: auto;
				white-space: nowrap;
			}
			.crumbs button {
				border: 0;
				background: none;
				padding: 3px 6px;
				color: var(--accent);
				font-weight: 500;
			}
			.crumbs span {
				color: var(--muted);
			}
			.toolbar-actions {
				display: flex;
				align-items: center;
				gap: 8px;
				flex-wrap: wrap;
			}
			.toolbar input[type='search'] {
				width: 150px;
				font-size: 12px;
				background: var(--panel);
			}

			#alert {
				background: var(--warn);
				color: #000;
				padding: 8px 16px;
				font-size: 12px;
				font-weight: 500;
				flex-shrink: 0;
			}

			#content {
				flex: 1;
				overflow-y: auto;
				padding: 16px;
				background: var(--panel);
			}
			#content.drag {
				outline: 2px dashed var(--accent);
				outline-offset: -8px;
				background: var(--active);
			}

			/* Grille et liste */
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
				gap: 16px;
			}
			.item {
				position: relative;
				border-radius: 8px;
				padding: 10px 6px;
				text-align: center;
				cursor: pointer;
				border: 1px solid transparent;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 6px;
				user-select: none;
			}
			.item:hover {
				background: var(--hover);
			}
			.item:focus-visible,
			.item.selected {
				background: var(--active);
				border-color: var(--accent);
				outline: 0;
			}
			.ico {
				font-size: 42px;
				line-height: 1;
				filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
			}
			.name {
				font-size: 12px;
				width: 100%;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.meta {
				font-size: 11px;
				color: var(--muted);
			}
			.acts {
				position: absolute;
				top: 4px;
				right: 4px;
				display: none;
				gap: 2px;
			}
			.item:hover .acts {
				display: flex;
			}
			.acts button {
				padding: 2px 6px;
				font-size: 11px;
				background: var(--panel);
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
			}

			/* Mode Liste */
			.list {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}
			.list .item {
				flex-direction: row;
				align-items: center;
				text-align: left;
				padding: 6px 10px;
				border-radius: 6px;
				gap: 12px;
			}
			.list .ico {
				font-size: 22px;
			}
			.list .name {
				flex: 1;
				margin: 0;
				font-weight: 400;
			}
			.list .meta {
				white-space: nowrap;
			}
			.list .acts {
				position: static;
				display: flex;
			}

			.empty {
				padding: 60px;
				text-align: center;
				color: var(--muted);
			}

			/* Notifications */
			#status {
				position: fixed;
				right: 20px;
				bottom: 20px;
				display: flex;
				flex-direction: column;
				gap: 8px;
				z-index: 20;
			}
			#status div {
				background: rgba(40, 40, 40, 0.85);
				backdrop-filter: blur(12px);
				color: #fff;
				padding: 10px 16px;
				border-radius: 10px;
				font-size: 12px;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
			}

			/* QuickLook (Aperçu) */
			#preview {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.65);
				backdrop-filter: blur(25px);
				-webkit-backdrop-filter: blur(25px);
				z-index: 10;
				display: flex;
				flex-direction: column;
				padding: 28px;
			}
			#preview header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				color: #fff;
				margin-bottom: 14px;
			}
			#preview header span {
				font-weight: 500;
				font-size: 14px;
			}
			#pbody {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 0;
			}
			#pbody img,
			#pbody video,
			#pbody iframe {
				max-width: 90%;
				max-height: 85vh;
				border-radius: 8px;
				box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
			}
			#pbody iframe {
				width: 100%;
				height: 100%;
				background: #fff;
			}

			/* Adaptation mobile fluide : masquage de la sidebar latérale pour laisser tout l'espace */
			@media (max-width: 768px) {
				aside {
					display: none;
				}
				.toolbar {
					padding: 8px 10px;
				}
				.toolbar input[type='search'] {
					width: 120px;
				}
			}
		</style>
	</head>
	<body>
		<div id="macos-window">
			<div class="titlebar">
				<div class="traffic-lights">
					<div class="dot close"></div>
					<div class="dot minimize"></div>
					<div class="dot zoom"></div>
				</div>
				<div class="titlebar-title" id="windowTitle">
					<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
						<path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z" />
					</svg>
				</div>
			</div>

			<div id="login">
				<form id="loginForm">
					<h1>📁 Mes fichiers</h1>
					<input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required />
					<button class="primary" type="submit">Se connecter</button>
					<div class="err" id="loginErr"></div>
				</form>
			</div>

			<div id="app" hidden>
				<aside>
					<div class="sidebar-section">
						<h2>Favoris</h2>
						<button class="sidebar-item active">
							<svg viewBox="0 0 24 24">
								<path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z" />
							</svg>
							Mes fichiers
						</button>
					</div>
					<div class="usage">
						<div class="track"><div id="bar"></div></div>
						<small id="usageTxt">…</small>
					</div>
					<button class="sidebar-item" id="logout" style="color: var(--danger); margin-top: 4px">
						<svg viewBox="0 0 24 24">
							<path
								d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"
							/>
						</svg>
						Déconnexion
					</button>
				</aside>
				<main>
					<div class="toolbar">
						<div class="crumbs" id="crumbs"></div>
						<div class="toolbar-actions">
							<input id="q" type="search" placeholder="Rechercher" />
							<button id="viewBtn" title="Changer l'affichage">☷ Liste</button>
							<button id="newFolder">Nouveau dossier</button>
							<button id="uploadBtn" class="primary">Envoyer</button>
							<input id="pick" type="file" multiple hidden />
						</div>
					</div>
					<div id="alert" hidden></div>
					<div id="content"></div>
				</main>
			</div>
		</div>

		<div id="preview" hidden>
			<header>
				<span id="ptitle"></span>
				<div><button id="pdl">Télécharger</button> <button id="pclose">Fermer</button></div>
			</header>
			<div id="pbody"></div>
		</div>
		<div id="status"></div>

		<script>
			const API_URL = 'https://mes-fichiers.ronaldornathan.workers.dev';

			const $ = (s) => document.querySelector(s);
			let token = '';
			try {
				token = localStorage.getItem('fm_token') || '';
			} catch {}
			let prefix = '',
				folders = [],
				files = [],
				view = 'grid',
				query = '',
				previewKey = '';

			function el(tag, props = {}, ...kids) {
				const e = document.createElement(tag);
				for (const [k, v] of Object.entries(props)) {
					if (k === 'class') e.className = v;
					else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
					else e.setAttribute(k, v);
				}
				e.append(...kids);
				return e;
			}

			function toast(msg, ms = 4000) {
				const t = el('div', {}, msg);
				$('#status').append(t);
				if (ms) setTimeout(() => t.remove(), ms);
				return t;
			}

			function fmtSize(n) {
				if (n < 1024) return n + ' o';
				const u = ['Ko', 'Mo', 'Go', 'To'];
				let i = -1;
				do {
					n /= 1024;
					i++;
				} while (n >= 1024 && i < u.length - 1);
				return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i];
			}

			function kind(name) {
				const e = (name.split('.').pop() || '').toLowerCase();
				if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif'].includes(e)) return 'img';
				if (e === 'pdf') return 'pdf';
				if (['mp4', 'webm', 'mov'].includes(e)) return 'vid';
				if (['mp3', 'wav', 'ogg', 'm4a', 'flac'].includes(e)) return 'aud';
				if (['zip', 'rar', '7z', 'tar', 'gz'].includes(e)) return 'zip';
				return 'file';
			}
			const ICONS = { folder: '📁', img: '🖼️', pdf: '📕', vid: '🎞️', aud: '🎵', zip: '🗜️', file: '📄' };

			async function api(path, opts = {}) {
				const res = await fetch(API_URL + path, {
					...opts,
					headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
				});
				if (res.status === 401 && path !== '/api/login') {
					logout();
					throw new Error('Session expirée, reconnecte-toi');
				}
				const data = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(data.error || 'Erreur ' + res.status);
				return data;
			}

			function logout() {
				token = '';
				try {
					localStorage.removeItem('fm_token');
				} catch {}
				$('#app').hidden = true;
				$('#login').hidden = false;
				$('#windowTitle').innerHTML =
					'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg> Connexion';
			}

			$('#loginForm').addEventListener('submit', async (e) => {
				e.preventDefault();
				$('#loginErr').textContent = '';
				if (API_URL.includes('TON-SOUS-DOMAINE')) {
					$('#loginErr').textContent = 'Configure API_URL dans le fichier.';
					return;
				}
				try {
					const d = await api('/api/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
					token = d.token;
					try {
						localStorage.setItem('fm_token', token);
					} catch {}
					$('#pw').value = '';
					start();
				} catch (err) {
					$('#loginErr').textContent = err.message;
				}
			});
			$('#logout').addEventListener('click', logout);

			function start() {
				$('#login').hidden = true;
				$('#app').hidden = false;
				$('#windowTitle').innerHTML =
					'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg> Mes fichiers';
				load('');
				refreshUsage();
			}

			async function load(p = prefix) {
				try {
					const d = await api('/api/files?prefix=' + encodeURIComponent(p));
					prefix = p;
					folders = d.folders;
					files = d.files;
					query = '';
					$('#q').value = '';
					render();
				} catch (e) {
					toast(e.message);
				}
			}

			async function refreshUsage() {
				try {
					const u = await api('/api/usage');
					$('#bar').style.width = Math.min(u.percent, 100) + '%';
					$('#bar').className = u.alert ? 'warn' : '';
					$('#usageTxt').textContent = fmtSize(u.used) + ' sur ' + fmtSize(u.limit) + ' (' + u.percent + ' %)';
					$('#alert').hidden = !u.alert;
					$('#alert').textContent =
						'Attention : tu approches de la limite de stockage (' + fmtSize(u.used) + ' utilisés). Pense à faire du tri.';
				} catch {}
			}

			function render() {
				const crumbs = $('#crumbs');
				crumbs.replaceChildren(el('button', { onclick: () => load('') }, 'Mes fichiers'));
				let acc = '';
				for (const seg of prefix.split('/').filter(Boolean)) {
					acc += seg + '/';
					const target = acc;
					crumbs.append(el('span', {}, '›'), el('button', { onclick: () => load(target) }, seg));
				}

				const q = query.toLowerCase();
				const fo = folders.filter((f) => f.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
				const fi = files.filter((f) => f.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
				const box = el('div', { class: view === 'grid' ? 'grid' : 'list' });

				for (const f of fo) {
					box.append(
						el(
							'div',
							{ class: 'item', tabindex: '0', onclick: () => load(f.prefix) },
							el('div', { class: 'ico' }, ICONS.folder),
							el('div', { class: 'name', title: f.name }, f.name),
						),
					);
				}
				for (const f of fi) {
					const acts = el(
						'div',
						{ class: 'acts' },
						el(
							'button',
							{
								title: 'Télécharger',
								onclick: (e) => {
									e.stopPropagation();
									download(f.key);
								},
							},
							'⬇',
						),
						el(
							'button',
							{
								title: 'Supprimer',
								onclick: (e) => {
									e.stopPropagation();
									remove(f);
								},
							},
							'🗑',
						),
					);
					box.append(
						el(
							'div',
							{ class: 'item', tabindex: '0', onclick: () => openFile(f) },
							el('div', { class: 'ico' }, ICONS[kind(f.name)]),
							el('div', { class: 'name', title: f.name }, f.name),
							el(
								'div',
								{ class: 'meta' },
								fmtSize(f.size) + (view === 'list' ? ' · ' + new Date(f.lastModified).toLocaleDateString('fr-FR') : ''),
							),
							acts,
						),
					);
				}
				const content = $('#content');
				content.replaceChildren(
					fo.length + fi.length
						? box
						: el('div', { class: 'empty' }, query ? 'Aucun résultat.' : 'Dossier vide. Glisse des fichiers ici ou clique sur « Envoyer ».'),
				);
			}

			$('#q').addEventListener('input', (e) => {
				query = e.target.value;
				render();
			});
			$('#viewBtn').addEventListener('click', () => {
				view = view === 'grid' ? 'list' : 'grid';
				$('#viewBtn').textContent = view === 'grid' ? '☷ Liste' : '▦ Grille';
				render();
			});

			async function signedUrl(key, inline) {
				return (await api('/api/download-url', { method: 'POST', body: JSON.stringify({ key, inline }) })).url;
			}

			async function download(key) {
				try {
					const a = el('a', { href: await signedUrl(key, false) });
					document.body.append(a);
					a.click();
					a.remove();
				} catch (e) {
					toast(e.message);
				}
			}

			async function openFile(f) {
				const k = kind(f.name);
				if (!['img', 'pdf', 'vid', 'aud'].includes(k)) return download(f.key);
				try {
					const url = await signedUrl(f.key, true);
					const node =
						k === 'img'
							? el('img', { src: url, alt: f.name })
							: k === 'pdf'
								? el('iframe', { src: url })
								: el(k === 'vid' ? 'video' : 'audio', { src: url, controls: '' });
					previewKey = f.key;
					$('#ptitle').textContent = f.name;
					$('#pbody').replaceChildren(node);
					$('#preview').hidden = false;
				} catch (e) {
					toast(e.message);
				}
			}
			function closePreview() {
				$('#preview').hidden = true;
				$('#pbody').replaceChildren();
			}
			$('#pclose').addEventListener('click', closePreview);
			$('#pdl').addEventListener('click', () => download(previewKey));
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape') closePreview();
			});

			async function remove(f) {
				if (!confirm('Supprimer « ' + f.name + ' » définitivement ?')) return;
				try {
					await api('/api/files?key=' + encodeURIComponent(f.key), { method: 'DELETE' });
					toast('Supprimé : ' + f.name);
					await load();
					refreshUsage();
				} catch (e) {
					toast(e.message);
				}
			}

			$('#newFolder').addEventListener('click', async () => {
				const name = (prompt('Nom du dossier :') || '').trim().replace(/[\/\\]/g, '');
				if (!name) return;
				try {
					await api('/api/folders', { method: 'POST', body: JSON.stringify({ prefix: prefix + name + '/' }) });
					load();
				} catch (e) {
					toast(e.message);
				}
			});

			function put(url, file, onProgress) {
				return new Promise((resolve, reject) => {
					const x = new XMLHttpRequest();
					x.open('PUT', url);
					x.upload.onprogress = (e) => e.lengthComputable && onProgress(Math.round((e.loaded / e.total) * 100));
					x.onload = () => (x.status < 300 ? resolve() : reject(new Error("Échec de l'envoi (" + x.status + ')')));
					x.onerror = () => reject(new Error('Envoi bloqué : vérifie le CORS du bucket'));
					x.send(file);
				});
			}

			async function upload(list) {
				for (const f of list) {
					const row = toast('Envoi : ' + f.name + ' 0 %', 0);
					try {
						const d = await api('/api/upload-url', { method: 'POST', body: JSON.stringify({ key: prefix + f.name, size: f.size }) });
						await put(d.url, f, (p) => (row.textContent = 'Envoi : ' + f.name + ' ' + p + ' %'));
						row.textContent = 'Envoyé : ' + f.name;
					} catch (e) {
						row.textContent = f.name + ' : ' + e.message;
					}
					setTimeout(() => row.remove(), 4000);
				}
				await load();
				refreshUsage();
			}

			$('#uploadBtn').addEventListener('click', () => $('#pick').click());
			$('#pick').addEventListener('change', (e) => {
				upload([...e.target.files]);
				e.target.value = '';
			});

			const content = $('#content');
			content.addEventListener('dragover', (e) => {
				e.preventDefault();
				content.classList.add('drag');
			});
			content.addEventListener('dragleave', () => content.classList.remove('drag'));
			content.addEventListener('drop', (e) => {
				e.preventDefault();
				content.classList.remove('drag');
				const list = [...e.dataTransfer.files].filter((f) => f.size > 0 || f.type);
				if (list.length) upload(list);
			});

			if (token) start();
			if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
		</script>
	</body>
</html>
