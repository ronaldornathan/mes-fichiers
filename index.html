<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icon-192.png" />
		<link rel="apple-touch-icon" href="icon-192.png" />
		<meta name="theme-color" content="#1e1e1e" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Fichiers" />
		<title>Mes fichiers</title>
	<style>
        :root {
  color-scheme: light dark;
  --window-bg: #f5f5f7;
  --sidebar-bg: #eeeeF2;
  --panel: #ffffff;
  --text: #202124;
  --muted: #777982;
  --line: rgba(30, 35, 45, .09);
  --accent: #087cff;
  --danger: #ff453a;
  --warn: #ffb020;
  --hover: rgba(25, 35, 55, .055);
  --active: rgba(8, 124, 255, .11);
  --shadow-sm: 0 2px 8px rgba(25, 35, 55, .045);
  --shadow-md: 0 12px 40px rgba(25, 35, 55, .09);
  --radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --window-bg: #191a1e;
    --sidebar-bg: #202126;
    --panel: #25262c;
    --text: #f3f4f7;
    --muted: #a0a2ad;
    --line: rgba(255, 255, 255, .085);
    --accent: #459bff;
    --danger: #ff6961;
    --warn: #ffbd4a;
    --hover: rgba(255, 255, 255, .055);
    --active: rgba(69, 155, 255, .16);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, .12);
    --shadow-md: 0 12px 40px rgba(0, 0, 0, .24);
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  font: 13px/1.5 -apple-system, BlinkMacSystemFont,
    "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  background: var(--window-bg);
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font: inherit;
  color: inherit;
}

button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 32px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .025);
  cursor: pointer;
  white-space: nowrap;
  transition: background .18s ease, border-color .18s ease,
    box-shadow .18s ease, transform .18s ease;
}

button:hover {
  background: var(--hover);
  border-color: rgba(100, 110, 130, .22);
}

button:active {
  transform: scale(.98);
}

button:focus-visible,
input:focus-visible,
.item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button.primary {
  color: #fff;
  background: var(--accent);
  border-color: transparent;
  box-shadow: 0 3px 8px rgba(8, 124, 255, .2);
}

button.primary:hover {
  filter: brightness(1.06);
  background: var(--accent);
}

[hidden] {
  display: none !important;
}

/* Fenêtre principale */

#macos-window {
  width: 100%;
  height: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--window-bg);
}

/* Barre de titre */

.titlebar {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  flex-shrink: 0;
  height: 46px;
  padding: 0 17px;
  border-bottom: 1px solid var(--line);
  background: var(--window-bg);
  user-select: none;
}

.traffic-lights {
  display: flex;
  align-items: center;
  gap: 8px;
}

.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid transparent;
  box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .12);
}

.dot.close {
  background: #ff6058;
  border-color: #e54b44;
}

.dot.minimize {
  background: #ffbd2e;
  border-color: #e5a51c;
}

.dot.zoom {
  background: #28c840;
  border-color: #20a832;
}

.titlebar-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 7px;
  max-width: 60%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -.15px;
}

/* Connexion */

#login {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(ellipse at 50% 35%,
      rgba(8, 124, 255, .075), transparent 48%),
    var(--window-bg);
}

#login form {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 360px;
  padding: 34px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  box-shadow: var(--shadow-md);
  text-align: center;
}

#login h1 {
  margin: 0 0 8px;
  font-size: 23px;
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: -.8px;
}

#login input[type="password"],
input[type="search"] {
  width: 100%;
  min-width: 0;
  min-height: 38px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--window-bg);
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}

#login input[type="password"]:focus,
input[type="search"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--active);
}

#login form button {
  min-height: 40px;
  border-radius: 10px;
  font-weight: 600;
}

.err,
#loginErr {
  color: var(--danger);
  font-size: 12px;
  overflow-wrap: anywhere;
}

/* Application */

#app {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
}

/* Sidebar */

aside {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  gap: 22px;
  width: 238px;
  padding: 23px 13px 14px;
  border-right: 1px solid var(--line);
  background: var(--sidebar-bg);
  user-select: none;
}

.sidebar-section {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

aside h2 {
  margin: 0 0 6px;
  padding: 0 10px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.sidebar-item {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  width: 100%;
  min-height: 37px;
  padding: 8px 11px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  box-shadow: none;
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
  text-align: left;
}

.sidebar-item:hover {
  background: var(--hover);
  border-color: transparent;
}

.sidebar-item.active {
  background: var(--active);
  color: var(--accent);
  border-color: transparent;
  font-weight: 650;
}

.sidebar-item svg {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  fill: currentColor;
}

.usage {
  margin-top: auto;
  padding: 14px 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--panel);
  box-shadow: var(--shadow-sm);
}

.usage::before {
  content: "Stockage";
  display: block;
  margin-bottom: 12px;
  font-size: 12px;
  font-weight: 650;
}

.track {
  height: 6px;
  overflow: hidden;
  border-radius: 99px;
  background: var(--line);
}

#bar {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #1684ff, #65b5ff);
  transition: width .4s ease;
}

#bar.warn {
  background: var(--warn);
}

.usage small {
  display: block;
  margin-top: 9px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

#logout {
  margin-top: 0 !important;
  color: var(--danger) !important;
}

/* Panneau principal */

main {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  background: var(--panel);
}

/* Barre d'outils */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  min-height: 65px;
  padding: 13px 22px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  flex-shrink: 0;
}

.crumbs {
  display: flex;
  align-items: center;
  gap: 5px;
  flex: 1 1 140px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  white-space: nowrap;
}

.crumbs::-webkit-scrollbar {
  display: none;
}

.crumbs button {
  min-height: 29px;
  padding: 4px 7px;
  border-color: transparent;
  background: transparent;
  box-shadow: none;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}

.crumbs button:hover {
  color: var(--accent);
  background: var(--hover);
}

.crumbs button:first-child {
  color: var(--accent);
}

.crumbs span {
  color: var(--muted);
  opacity: .65;
}

.toolbar-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}

.toolbar input[type="search"] {
  width: 185px;
  min-height: 34px;
  padding: 7px 11px;
  font-size: 12px;
  background: var(--window-bg);
}

.toolbar-actions button {
  min-height: 34px;
  font-size: 12px;
  font-weight: 550;
}

#alert {
  flex-shrink: 0;
  padding: 11px 20px;
  border-bottom: 1px solid rgba(255, 159, 10, .2);
  background: rgba(255, 159, 10, .12);
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
}

/* Zone des fichiers */

#content {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 24px;
  background: var(--panel);
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
  transition: background .18s;
}

#content.drag {
  outline: 2px dashed var(--accent);
  outline-offset: -9px;
  background: var(--active);
}

/* Grille */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  align-content: start;
  gap: 12px;
}

.item {
  position: relative;
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  padding: 17px 9px 13px;
  border: 1px solid transparent;
  border-radius: 13px;
  background: transparent;
  cursor: pointer;
  text-align: center;
  user-select: none;
  transition: background .18s, border-color .18s,
    transform .18s, box-shadow .18s;
}

.grid .item:hover {
  background: var(--hover);
  border-color: var(--line);
  transform: translateY(-2px);
}

.item:focus-visible,
.item.selected {
  background: var(--active);
  border-color: var(--accent);
  outline: none;
}

.ico {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 49px;
  font-size: 43px;
  line-height: 1;
  filter: drop-shadow(0 4px 5px rgba(0, 0, 0, .08));
  transition: transform .18s;
}

.grid .item:hover .ico {
  transform: scale(1.06);
}

.name {
  width: 100%;
  overflow: hidden;
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.meta {
  color: var(--muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.acts {
  position: absolute;
  top: 5px;
  right: 5px;
  display: flex;
  gap: 4px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s;
}

.item:hover .acts,
.item:focus-within .acts {
  opacity: 1;
  pointer-events: auto;
}

.acts button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 27px;
  min-height: 27px;
  padding: 3px;
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow-sm);
  font-size: 12px;
}

/* Liste */

.list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.list .item {
  flex-direction: row;
  align-items: center;
  gap: 13px;
  min-height: 49px;
  padding: 7px 12px;
  border-radius: 9px;
  text-align: left;
}

.list .item:hover {
  background: var(--hover);
}

.list .ico {
  min-height: auto;
  width: 30px;
  flex-shrink: 0;
  font-size: 24px;
}

.list .name {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  font-weight: 500;
}

.list .meta {
  min-width: 72px;
  text-align: right;
  white-space: nowrap;
}

.list .acts {
  position: static;
  flex-shrink: 0;
  opacity: 1;
  pointer-events: auto;
}

.empty {
  display: flex;
  min-height: 260px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

/* Notifications */

#status {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 9px;
  width: min(360px, calc(100vw - 32px));
  pointer-events: none;
}

#status div {
  padding: 12px 15px;
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 12px;
  background: rgba(35, 36, 42, .93);
  box-shadow: 0 10px 35px rgba(0, 0, 0, .2);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  color: #fff;
  font-size: 12px;
  overflow-wrap: anywhere;
  animation: toast-in .2s ease-out;
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(7px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Aperçu */

#preview {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  padding: 24px;
  background: rgba(15, 16, 20, .83);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

#preview header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 48px;
  margin-bottom: 16px;
  color: #fff;
}

#preview header span {
  min-width: 0;
  overflow: hidden;
  font-size: 13px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#preview header div {
  display: flex;
  flex-shrink: 0;
  gap: 8px;
}

#preview header button {
  border-color: rgba(255, 255, 255, .15);
  background: rgba(255, 255, 255, .1);
  color: #fff;
}

#preview header button:hover {
  background: rgba(255, 255, 255, .2);
}

#pbody {
  display: flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  min-height: 0;
  overflow: auto;
}

#pbody img,
#pbody video,
#pbody iframe {
  max-width: 100%;
  max-height: 100%;
  border: 1px solid rgba(255, 255, 255, .08);
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
}

#pbody img,
#pbody video {
  object-fit: contain;
}

#pbody iframe {
  width: min(100%, 1100px);
  height: 100%;
  background: #fff;
}

#pbody audio {
  width: min(500px, 100%);
}

/* Tablettes */

@media (max-width: 900px) {
  aside {
    width: 195px;
    padding-right: 10px;
    padding-left: 10px;
  }

  .toolbar {
    gap: 8px;
    padding: 11px 14px;
  }

  .toolbar-actions {
    gap: 6px;
  }

  .toolbar input[type="search"] {
    width: 145px;
  }

  #content {
    padding: 18px;
  }

  .grid {
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
  }
}

/* Mobiles */

@media (max-width: 600px) {
  .titlebar {
    height: 42px;
    padding: 0 13px;
  }

  .titlebar-title {
    font-size: 12px;
  }

  #login {
    padding: 20px;
  }

  #login form {
    max-width: 360px;
    padding: 27px 22px;
    border-radius: 18px;
  }

  #login h1 {
    font-size: 21px;
  }

  aside {
    display: none;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
  }

  .crumbs {
    flex: 1 1 100%;
    min-height: 28px;
  }

  .toolbar-actions {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    width: 100%;
    gap: 7px;
  }

  .toolbar input[type="search"] {
    grid-column: 1 / -1;
    width: 100%;
    min-height: 39px;
    font-size: 13px;
  }

  .toolbar-actions button {
    min-width: 0;
    min-height: 38px;
    padding: 7px 10px;
    font-size: 11px;
  }

  #content {
    padding: 13px;
  }

  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px;
  }

  .item {
    gap: 8px;
    padding: 14px 5px 11px;
    border-radius: 11px;
  }

  .ico {
    min-height: 43px;
    font-size: 36px;
  }

  .name {
    font-size: 11px;
  }

  .meta {
    font-size: 10px;
  }

  .grid .acts {
    top: 3px;
    right: 3px;
  }

  .grid .acts button {
    width: 25px;
    min-height: 25px;
  }

  .list .item {
    gap: 8px;
    padding: 8px;
  }

  .list .ico {
    width: 26px;
    font-size: 22px;
  }

  .list .meta {
    min-width: auto;
    font-size: 10px;
  }

  .list .acts {
    gap: 3px;
  }

  .list .acts button {
    width: 27px;
    padding: 3px;
  }

  .empty {
    min-height: 200px;
    padding: 25px 14px;
  }

  #preview {
    padding: 12px;
  }

  #preview header {
    gap: 8px;
    margin-bottom: 10px;
  }

  #preview header button {
    min-height: 34px;
    padding: 6px 9px;
    font-size: 11px;
  }

  #status {
    right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom));
    width: calc(100vw - 24px);
  }
}

/* Accessibilité et animations */

@media (hover: none) {
  .acts {
    opacity: 1;
    pointer-events: auto;
  }

  .grid .item:hover {
    transform: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

				<div class="titlebar-title" id="windowTitle">
					<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
						<path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z" />
					</svg>
				</div>
			</div>

			<div id="login">
				<form id="loginForm">
					<h1>📁 Mes fichiers</h1>
					<input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required />

			</div>

			<div id="app" hidden>
				<aside>
					<div class="sidebar-section">
						<h2>Favoris</h2>
						<button class="sidebar-item active">
							<svg viewBox="0 0 24 24">

							</svg>
							Mes fichiers
						</button>
					</div>
					<div class="usage">
						<div class="track"><div id="bar"></div></div>
						<small id="usageTxt">…</small>
					</div>
					<button class="sidebar-item" id="logout" style="color: var(--danger); margin-top: 4px">
						<svg viewBox="0 0 24 24">
							<path
								d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"
							/>
						</svg>
						Déconnexion
					</button>
				</aside>
				<main>
					<div class="toolbar">
						<div class="crumbs" id="crumbs"></div>
						<div class="toolbar-actions">
							<input id="q" type="search" placeholder="Rechercher" />
							<button id="viewBtn" title="Changer l'affichage">☷ Liste</button>
							<button id="newFolder">Nouveau dossier</button>
							<button id="uploadBtn" class="primary">Envoyer</button>
							<input id="pick" type="file" multiple hidden />
						</div>
					</div>
					<div id="alert" hidden></div>
					<div id="content"></div>
				</main>
			</div>
		</div>

		<div id="preview" hidden>
			<header>
				<span id="ptitle"></span>
				<div><button id="pdl">Télécharger</button> <button id="pclose">Fermer</button></div>
			</header>
			<div id="pbody"></div>
		</div>
		<div id="status"></div>

		<script>
			const API_URL = 'https://mes-fichiers.ronaldornathan.workers.dev';

			const $ = (s) => document.querySelector(s);
			let token = '';
			try {
				token = localStorage.getItem('fm_token') || '';
			} catch {}
			let prefix = '',
				folders = [],
				files = [],
				view = 'grid',
				query = '',
				previewKey = '';

			function el(tag, props = {}, ...kids) {
				const e = document.createElement(tag);
				for (const [k, v] of Object.entries(props)) {
					if (k === 'class') e.className = v;
					else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
					else e.setAttribute(k, v);
				}
				e.append(...kids);
				return e;
			}

			function toast(msg, ms = 4000) {
				const t = el('div', {}, msg);
				$('#status').append(t);
				if (ms) setTimeout(() => t.remove(), ms);
				return t;
			}

			function fmtSize(n) {
				if (n < 1024) return n + ' o';
				const u = ['Ko', 'Mo', 'Go', 'To'];
				let i = -1;
				do {
					n /= 1024;
					i++;
				} while (n >= 1024 && i < u.length - 1);
				return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i];
			}

			function kind(name) {
				const e = (name.split('.').pop() || '').toLowerCase();
				if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif'].includes(e)) return 'img';
				if (e === 'pdf') return 'pdf';
				if (['mp4', 'webm', 'mov'].includes(e)) return 'vid';
				if (['mp3', 'wav', 'ogg', 'm4a', 'flac'].includes(e)) return 'aud';
				if (['zip', 'rar', '7z', 'tar', 'gz'].includes(e)) return 'zip';
				return 'file';
			}
			const ICONS = { folder: '📁', img: '🖼️', pdf: '📕', vid: '🎞️', aud: '🎵', zip: '🗜️', file: '📄' };

			async function api(path, opts = {}) {
				const res = await fetch(API_URL + path, {
					...opts,
					headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
				});
				if (res.status === 401 && path !== '/api/login') {
					logout();
					throw new Error('Session expirée, reconnecte-toi');
				}
				const data = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(data.error || 'Erreur ' + res.status);
				return data;
			}

			function logout() {
				token = '';
				try {
					localStorage.removeItem('fm_token');
				} catch {}
				$('#app').hidden = true;
				$('#login').hidden = false;
				$('#windowTitle').innerHTML =
					'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg> Connexion';
			}

			$('#loginForm').addEventListener('submit', async (e) => {
				e.preventDefault();
				$('#loginErr').textContent = '';
				if (API_URL.includes('TON-SOUS-DOMAINE')) {
					$('#loginErr').textContent = 'Configure API_URL dans le fichier.';
					return;
				}
				try {
					const d = await api('/api/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
					token = d.token;
					try {
						localStorage.setItem('fm_token', token);
					} catch {}
					$('#pw').value = '';
					start();
				} catch (err) {
					$('#loginErr').textContent = err.message;
				}
			});
			$('#logout').addEventListener('click', logout);

			function start() {
				$('#login').hidden = true;
				$('#app').hidden = false;
				$('#windowTitle').innerHTML =
					'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg> Mes fichiers';
				load('');
				refreshUsage();
			}

			async function load(p = prefix) {
				try {
					const d = await api('/api/files?prefix=' + encodeURIComponent(p));
					prefix = p;
					folders = d.folders;
					files = d.files;
					query = '';
					$('#q').value = '';
					render();
				} catch (e) {
					toast(e.message);
				}
			}

			async function refreshUsage() {
				try {
					const u = await api('/api/usage');
					$('#bar').style.width = Math.min(u.percent, 100) + '%';
					$('#bar').className = u.alert ? 'warn' : '';
					$('#usageTxt').textContent = fmtSize(u.used) + ' sur ' + fmtSize(u.limit) + ' (' + u.percent + ' %)';
					$('#alert').hidden = !u.alert;
					$('#alert').textContent =
						'Attention : tu approches de la limite de stockage (' + fmtSize(u.used) + ' utilisés). Pense à faire du tri.';
				} catch {}
			}

			function render() {
				const crumbs = $('#crumbs');
				crumbs.replaceChildren(el('button', { onclick: () => load('') }, 'Mes fichiers'));
				let acc = '';
				for (const seg of prefix.split('/').filter(Boolean)) {
					acc += seg + '/';
					const target = acc;
					crumbs.append(el('span', {}, '›'), el('button', { onclick: () => load(target) }, seg));
				}

				const q = query.toLowerCase();
				const fo = folders.filter((f) => f.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
				const fi = files.filter((f) => f.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
				const box = el('div', { class: view === 'grid' ? 'grid' : 'list' });

				for (const f of fo) {
					box.append(
						el(
							'div',
							{ class: 'item', tabindex: '0', onclick: () => load(f.prefix) },
							el('div', { class: 'ico' }, ICONS.folder),
							el('div', { class: 'name', title: f.name }, f.name),
						),
					);
				}
				for (const f of fi) {
					const acts = el(
						'div',
						{ class: 'acts' },
						el(
							'button',
							{
								title: 'Télécharger',
								onclick: (e) => {
									e.stopPropagation();
									download(f.key);
								},
							},
							'⬇',
						),
						el(
							'button',
							{
								title: 'Supprimer',
								onclick: (e) => {
									e.stopPropagation();
									remove(f);
								},
							},
							'🗑',
						),
					);
					box.append(
						el(
							'div',
							{ class: 'item', tabindex: '0', onclick: () => openFile(f) },
							el('div', { class: 'ico' }, ICONS[kind(f.name)]),
							el('div', { class: 'name', title: f.name }, f.name),
							el(
								'div',
								{ class: 'meta' },
								fmtSize(f.size) + (view === 'list' ? ' · ' + new Date(f.lastModified).toLocaleDateString('fr-FR') : ''),
							),
							acts,
						),
					);
				}
				const content = $('#content');
				content.replaceChildren(
					fo.length + fi.length
						? box
						: el('div', { class: 'empty' }, query ? 'Aucun résultat.' : 'Dossier vide. Glisse des fichiers ici ou clique sur « Envoyer ».'),
				);
			}

			$('#q').addEventListener('input', (e) => {
				query = e.target.value;
				render();
			});
			$('#viewBtn').addEventListener('click', () => {
				view = view === 'grid' ? 'list' : 'grid';
				$('#viewBtn').textContent = view === 'grid' ? '☷ Liste' : '▦ Grille';
				render();
			});

			async function signedUrl(key, inline) {
				return (await api('/api/download-url', { method: 'POST', body: JSON.stringify({ key, inline }) })).url;
			}

			async function download(key) {
				try {
					const a = el('a', { href: await signedUrl(key, false) });
					document.body.append(a);
					a.click();
					a.remove();
				} catch (e) {
					toast(e.message);
				}
			}

			async function openFile(f) {
				const k = kind(f.name);
				if (!['img', 'pdf', 'vid', 'aud'].includes(k)) return download(f.key);
				try {
					const url = await signedUrl(f.key, true);
					const node =
						k === 'img'
							? el('img', { src: url, alt: f.name })
							: k === 'pdf'
								? el('iframe', { src: url })
								: el(k === 'vid' ? 'video' : 'audio', { src: url, controls: '' });
					previewKey = f.key;
					$('#ptitle').textContent = f.name;
					$('#pbody').replaceChildren(node);
					$('#preview').hidden = false;
				} catch (e) {
					toast(e.message);
				}
			}
			function closePreview() {
				$('#preview').hidden = true;
				$('#pbody').replaceChildren();
			}
			$('#pclose').addEventListener('click', closePreview);
			$('#pdl').addEventListener('click', () => download(previewKey));
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape') closePreview();
			});

			async function remove(f) {
				if (!confirm('Supprimer « ' + f.name + ' » définitivement ?')) return;
				try {
					await api('/api/files?key=' + encodeURIComponent(f.key), { method: 'DELETE' });
					toast('Supprimé : ' + f.name);
					await load();
					refreshUsage();
				} catch (e) {
					toast(e.message);
				}
			}

			$('#newFolder').addEventListener('click', async () => {
				const name = (prompt('Nom du dossier :') || '').trim().replace(/[\/\\]/g, '');
				if (!name) return;
				try {
					await api('/api/folders', { method: 'POST', body: JSON.stringify({ prefix: prefix + name + '/' }) });
					load();
				} catch (e) {
					toast(e.message);
				}
			});

			function put(url, file, onProgress) {
				return new Promise((resolve, reject) => {
					const x = new XMLHttpRequest();
					x.open('PUT', url);
					x.upload.onprogress = (e) => e.lengthComputable && onProgress(Math.round((e.loaded / e.total) * 100));
					x.onload = () => (x.status < 300 ? resolve() : reject(new Error("Échec de l'envoi (" + x.status + ')')));
					x.onerror = () => reject(new Error('Envoi bloqué : vérifie le CORS du bucket'));
					x.send(file);
				});
			}

			async function upload(list) {
				for (const f of list) {
					const row = toast('Envoi : ' + f.name + ' 0 %', 0);
					try {
						const d = await api('/api/upload-url', { method: 'POST', body: JSON.stringify({ key: prefix + f.name, size: f.size }) });
						await put(d.url, f, (p) => (row.textContent = 'Envoi : ' + f.name + ' ' + p + ' %'));
						row.textContent = 'Envoyé : ' + f.name;
					} catch (e) {
						row.textContent = f.name + ' : ' + e.message;
					}
					setTimeout(() => row.remove(), 4000);
				}
				await load();
				refreshUsage();
			}

			$('#uploadBtn').addEventListener('click', () => $('#pick').click());
			$('#pick').addEventListener('change', (e) => {
				upload([...e.target.files]);
				e.target.value = '';
			});

			const content = $('#content');
			content.addEventListener('dragover', (e) => {
				e.preventDefault();
				content.classList.add('drag');
			});
			content.addEventListener('dragleave', () => content.classList.remove('drag'));
			content.addEventListener('drop', (e) => {
				e.preventDefault();
				content.classList.remove('drag');
				const list = [...e.dataTransfer.files].filter((f) => f.size > 0 || f.type);
				if (list.length) upload(list);
			});

			if (token) start();
			if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
		</script>
	</body>
</html>
