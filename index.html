<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#16181d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Fichiers" />
<title>Mes fichiers</title>
<link rel="stylesheet" href="css/app.css" />
<link rel="modulepreload" href="js/main.js" />
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12m0 0-4-4m4 4 4-4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4m-4-4h11"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
<symbol id="i-move" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 13h6m-2.5-2.5L15 13l-2.5 2.5"/></symbol>
<symbol id="i-all" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"/></symbol>
</defs></svg>

<div id="login">
  <form id="loginForm">
    <div class="logo"><svg><use href="#i-folder"/></svg></div>
    <h1>Mes fichiers</h1>
    <p>Entre ton mot de passe pour accéder à ton espace.</p>
    <input id="pw" class="field" type="password" placeholder="Mot de passe" autocomplete="current-password" required />
    <button class="btn primary" style="height:40px" type="submit">Se connecter</button>
    <div id="loginErr" role="alert"></div>
    <button type="button" class="linkbtn" id="showJoin">J’ai un code ou un lien d’invitation</button>
  </form>
  <form id="joinForm" hidden>
    <div class="logo"><svg><use href="#i-share"/></svg></div>
    <h1>Rejoindre un partage</h1>
    <p>Colle le code (ou le lien) que tu as reçu.</p>
    <input id="jcode" class="field" placeholder="Code d’invitation" autocomplete="off" required />
    <input id="jname" class="field" placeholder="Ton prénom (facultatif)" maxlength="30" autocomplete="nickname" />
    <button class="btn primary" style="height:40px" type="submit">Rejoindre</button>
    <div id="joinErr" class="err" role="alert"></div>
    <button type="button" class="linkbtn" id="showLogin">Retour à la connexion</button>
  </form>
</div>

<div id="app" hidden>
  <div id="scrim"></div>
  <aside id="side">
    <div class="brand"><div class="logo"><svg><use href="#i-folder"/></svg></div><span id="brandName">Mes fichiers</span></div>
    <nav id="filters" aria-label="Filtres par type"></nav>
    <div class="usage" id="usageBox"><b>Stockage</b><div class="track"><div id="bar"></div></div><small id="usageTxt">…</small></div>
    <button class="nav logout" id="logout"><svg><use href="#i-out"/></svg><span id="logoutTxt">Déconnexion</span></button>
  </aside>
  <main>
    <div class="top">
      <button class="btn icon" id="menuBtn" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
      <nav id="crumbs" aria-label="Chemin"></nav>
      <button class="gauge" id="gauge" data-level="unknown" aria-label="Stockage"><span class="led"></span><span id="gaugeTxt">–</span></button>
    </div>
    <div class="tools">
      <div class="search"><svg><use href="#i-search"/></svg><input id="q" class="field" type="search" placeholder="Rechercher dans ce dossier" aria-label="Rechercher" /><kbd>/</kbd></div>
      <span class="spacer"></span>
      <select id="sort" class="btn" aria-label="Trier">
        <option value="name-asc">Nom (A→Z)</option><option value="date-desc">Plus récents</option><option value="size-desc">Plus lourds</option>
      </select>
      <button class="btn icon" id="viewBtn" aria-label="Changer l’affichage" title="Grille / liste (V)"><svg><use href="#i-list"/></svg></button>
      <button class="btn" id="shareBtn"><svg><use href="#i-share"/></svg>Partager<span class="badge" id="shareBadge" hidden></span></button>
      <button class="btn" id="newFolder"><svg><use href="#i-plus"/></svg>Dossier</button>
      <button class="btn primary" id="uploadBtn"><svg><use href="#i-up"/></svg>Envoyer</button>
      <input id="pick" type="file" multiple hidden />
    </div>
    <div id="selbar" hidden>
      <b id="selCount"></b>
      <button class="btn" id="selAll">Tout sélectionner</button>
      <button class="btn" id="selDl"><svg><use href="#i-down"/></svg>Télécharger</button>
      <button class="btn danger" id="selDel"><svg><use href="#i-trash"/></svg>Supprimer</button>
      <button class="btn icon" id="selClear" aria-label="Annuler la sélection"><svg><use href="#i-x"/></svg></button>
    </div>
    <div id="alert" hidden></div>
    <div id="content"></div>
  </main>
</div>

<dialog id="shareDlg" class="wide">
  <div class="dhead"><h3>Partager</h3><button class="btn icon" id="shareClose" aria-label="Fermer"><svg><use href="#i-x"/></svg></button></div>
  <div id="shareBody"></div>
</dialog>
<div id="menu" hidden></div>
<dialog id="dlg"><form method="dialog">
  <h3 id="dt"></h3><p id="dx"></p>
  <input id="di" class="field" maxlength="120" autocomplete="off" />
  <div class="row"><button type="button" class="btn" id="dno">Annuler</button><button class="btn primary" id="dok" value="ok">OK</button></div>
</form></dialog>
<div id="preview" hidden>
  <header><span id="ptitle"></span>
    <button class="btn" id="pdl"><svg><use href="#i-down"/></svg>Télécharger</button>
    <button class="btn icon" id="pclose" aria-label="Fermer"><svg><use href="#i-x"/></svg></button></header>
  <div id="pwrap">
    <button class="btn icon" id="pprev" aria-label="Précédent"><svg><use href="#i-left"/></svg></button>
    <div id="pbody"></div>
    <button class="btn icon" id="pnext" aria-label="Suivant"><svg><use href="#i-right"/></svg></button>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
